services:
  metapi:
    image: node:22-bookworm-slim
    container_name: metapi
    working_dir: /app
    ports:
      - "4000:4000"
      - "5173:5173"
    volumes:
      - .:/app
      - metapi_node_modules:/app/node_modules
      - ./data:/app/data
    environment:
      NODE_ENV: development
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      PROXY_TOKEN: ${PROXY_TOKEN:?PROXY_TOKEN is required}
      ACCOUNT_CREDENTIAL_SECRET: ${ACCOUNT_CREDENTIAL_SECRET:?ACCOUNT_CREDENTIAL_SECRET is required}
      CHECKIN_CRON: ${CHECKIN_CRON:-0 8 * * *}
      BALANCE_REFRESH_CRON: ${BALANCE_REFRESH_CRON:-0 * * * *}
      PORT: ${PORT:-4000}
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      VITE_DEV_HOST: 0.0.0.0
      VITE_FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      DEV_PROXY_TARGET: http://127.0.0.1:${PORT:-4000}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    command: >
      sh -lc "npm ci --ignore-scripts --no-audit --no-fund && npm rebuild esbuild sharp better-sqlite3 --no-audit --no-fund && npm exec -- concurrently \"npm run dev:server\" \"npm exec -- vite --host 0.0.0.0 --port ${FRONTEND_PORT:-5173}\""
    restart: unless-stopped

volumes:
  metapi_node_modules:
